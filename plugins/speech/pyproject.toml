[project]
name = "mfreak-speech"
version = "0.1.0"
description = "Put your own words on the MicroFreak's Speech engine: LPC analysis, a firmware patch, and SysEx uploads, for microfreak-tools. Not affiliated with Arturia."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.15"
dependencies = ["microfreak-tools>=0.1.0,<0.2", "numpy>=2.0"]

[project.entry-points."mfreak.plugins"]
speech = "mfreak_speech:plugin"

[project.urls]
Homepage = "https://github.com/gbryant/microfreak-tools"
Issues = "https://github.com/gbryant/microfreak-tools/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mfreak_speech"]

[tool.uv.sources]
microfreak-tools = { workspace = true }
